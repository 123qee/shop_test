                      - generic [ref=f8e1879]:
                        - generic [ref=f8e1885]:
                          - paragraph [ref=f8e1886]: Einmal gut angezogen, immer wieder bestellt – diese T-Shirts passen einfach!
                          - paragraph
                          - paragraph [ref=f8e1887]: Manchmal braucht es gar keine teuren Marken oder ausgefallenen Designs, um mit einem Kleidungsstück rundum zufrieden zu sein. Ein gutes T-Shirt muss für mich vor allem bequem sein, ordentlich sitzen und auch nach mehreren Wäschen noch so aussehen wie am ersten Tag. Klingt eigentlich ganz einfach, ist es aber leider nicht immer. Bei diesen T-Shirts von FM London habe ich genau das gefunden. Ich hatte mir bereits jeweils drei Stück in Weiß und Schwarz bestellt und war damit so zufrieden, dass jetzt wieder Nachschub her musste. Schließlich kann man gute T-Shirts nie genug im Schrank haben!
                          - paragraph
                          - paragraph [ref=f8e1888]: Bei der Passform bin ich durchaus etwas anspruchsvoll. Ich bin 1,72 m groß, wiege ungefähr 70 kg und ja, ein kleiner Bauch ist leider auch vorhanden. Trotzdem passt mir die Größe L bei diesen Shirts wirklich hervorragend. Sie sitzen im Schulter- und Brustbereich angenehm, ohne einzuengen, und fallen zum Bauch hin schön locker. Dabei wirken sie aber keineswegs schlabbrig oder zu weit. Genau diese Mischung gefällt mir besonders gut, denn ein T-Shirt soll schließlich ordentlich aussehen und nicht wie ein Sack am Körper hängen.
                          - paragraph
                          - paragraph [ref=f8e1889]: "Besonders wichtig ist mir der Halsausschnitt. Ich mag es überhaupt nicht, wenn der Kragen nach kurzer Zeit ausleiert, sich wellt oder viel zu weit vom Hals absteht. Bei diesen Shirts liegt der Rundhalsausschnitt angenehm eng an, ohne dabei zu drücken. Und das Beste: Auch nach regelmäßigem Tragen und Waschen bleibt er schön in Form. Für mich ist das tatsächlich eines der wichtigsten Qualitätsmerkmale bei einem T-Shirt. Wenn der Kragen nicht mehr ordentlich sitzt, kann der Rest noch so schön sein – dann gefällt mir das ganze Shirt nicht mehr."
                          - paragraph
                          - paragraph [ref=f8e1890]: Auch beim Material und der Verarbeitung gibt es von meiner Seite nichts zu beanstanden. Die Baumwolle fühlt sich angenehm weich auf der Haut an und hat für meinen Geschmack genau die richtige Stärke. Nicht zu dünn, sodass man das Gefühl hat, nach ein paar Wäschen bleibt nichts mehr davon übrig, aber auch nicht unangenehm dick. Die Nähte sind sauber verarbeitet und die Shirts lassen sich wirklich angenehm tragen. Gerade für diesen Preis finde ich die gebotene Qualität bemerkenswert gut.
                          - paragraph
                          - paragraph [ref=f8e1891]: Im Alltag sind die T-Shirts für mich inzwischen richtige Allrounder geworden. Ich trage sie sowohl unter einem Hemd als auch einfach so zur Jeans oder zu einer bequemen Freizeithose. Besonders die weißen Shirts eignen sich hervorragend zum Unterziehen, während die schwarzen auch alleine richtig gut aussehen. Durch den schlichten Schnitt passen sie eigentlich immer, egal ob bei der Arbeit, zu Hause oder unterwegs. Genau solche unkomplizierten Kleidungsstücke mag ich.
                          - paragraph
                          - paragraph [ref=f8e1892]: Und wie sieht es nach dem Waschen aus? Auch hier haben mich meine bisherigen Shirts überzeugt. Sie sind bei mir nicht merklich eingelaufen, behalten ihre Form und sitzen weiterhin genauso gut wie zuvor. Besonders erfreulich ist natürlich, dass auch der Halsausschnitt seine Form behält. Das ist für mich der beste Beweis dafür, dass die Qualität nicht nur beim ersten Anprobieren stimmt. Schließlich habe ich wenig davon, wenn ein T-Shirt neu perfekt aussieht und nach drei Wäschen plötzlich eine ganz andere Größe oder Form hat.
                          - paragraph
                          - paragraph [ref=f8e1893]: Fazit
                          - paragraph
                          - paragraph [ref=f8e1894]: Bequem, sehr gut verarbeitet, angenehm zu tragen und mit einer Passform, die auch nach dem Waschen überzeugt. Besonders der formstabile, eng anliegende Halsausschnitt ist für mich ein großer Pluspunkt. Für Alltag, Freizeit oder unter dem Hemd sind diese Baumwollshirts einfach ideal. Und wenn man ein Produkt bereits mehrfach gekauft hat, sagt das eigentlich schon alles. Für mich ein hervorragendes Preis-Leistungs-Verhältnis und verdiente 5 Sterne!
