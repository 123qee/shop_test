                      - list [ref=f8e823]:
                        - listitem [ref=f8e824]: "SCHMEICHELHAFTE PASSFORM: Haben Sie genug von schlecht sitzenden T-Shirts? Diese Herren-T-Shirts betonen Ihre Arme, Schultern und Brust, damit Sie sich von der Masse abheben, und bieten gleichzeitig eine lockere Passform um den Bauch für einen lässigen Look"
