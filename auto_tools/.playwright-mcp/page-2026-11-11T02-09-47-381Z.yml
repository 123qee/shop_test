                      - generic [ref=f8e1870]:
                        - 'link "Größe: L Farbe: Schwarz, Grau, Weiß, Marineblau, Anthrazit (5er-pack)" [ref=f8e1871] [cursor=pointer]':
                          - /url: /portal/customer-reviews/B0C5D6ZDFZ/ref=cm_cr_dp_d_rvw_fmt?_encoding=UTF8&formatType=current_format
