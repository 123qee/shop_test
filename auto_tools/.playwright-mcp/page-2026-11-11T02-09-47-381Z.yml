                      - generic [ref=f8e1966]:
                        - generic [ref=f8e1972]:
                          - paragraph [ref=f8e1973]: Ich habe mir im März direkt zwei 5er-Packs bestellt, also insgesamt zehn Shirts. Inzwischen kam noch ein weiteres 5er-Pack dazu und damit habe ich jetzt 15 Stück hier.
                          - paragraph [ref=f8e1974]: Ich trage die Shirts praktisch täglich – im Alltag, zuhause, bei der Arbeit und auch mal als Untershirt.
                          - paragraph
                          - paragraph [ref=f8e1975]: Ich habe Größe XXL genommen und die fällt bei mir genau so aus, wie ich es erwartet habe. Nicht eng, nicht sackig, sondern eher normal bis locker. Besonders gut gefällt mir die Passform am Hals und an den Ärmeln. Der Kragen sitzt ordentlich und ist bei meinen ersten Shirts nach ungefähr einem halben Jahr noch nicht ausgeleiert. Die Ärmel sind etwas enger geschnitten, ohne unangenehm zu sein, und insgesamt sitzen die Shirts einfach gut.
                          - paragraph
                          - paragraph [ref=f8e1976]: Der Stoff besteht aus Baumwolle und fühlt sich angenehm weich an, ohne zu dünn zu wirken. Blickdicht sind die Shirts auf jeden Fall. Bei Wärme schwitzt man natürlich trotzdem, aber für ein normales Baumwollshirt finde ich das völlig okay.
                          - paragraph
                          - paragraph [ref=f8e1977]: Ich wasche sie immer bei 40 Grad plus Hygienespüler und trockne sie an der Luft. Eingelaufen ist bisher nichts, die Passform hat sich nicht verändert und auch die Farben sind bei mir noch stabil. Gerade bei dunkleren Shirts habe ich bisher kein auffälliges Ausbleichen festgestellt. Auch unter den Armen hatte ich bislang keine unschönen Verfärbungen.
                          - paragraph
                          - paragraph [ref=f8e1978]: Die Verarbeitung ist ebenfalls ordentlich. Keine offenen Nähte, keine losen Fäden, keine Löcher oder dünnen Stellen. Zwischen den einzelnen Shirts im Pack konnte ich bisher auch keine Qualitätsunterschiede feststellen.
                          - paragraph
                          - paragraph [ref=f8e1979]: "Für mich funktionieren die Shirts genau als das, was sie sein sollen: einfache, bequeme Basic-Shirts, die man jeden Tag tragen kann. Der größte Pluspunkt ist für mich die Kombination aus Passform, angenehmem Stoff und Preis. Ich habe inzwischen 15 Stück davon und würde wahrscheinlich irgendwann sogar noch ein weiteres Pack holen."
