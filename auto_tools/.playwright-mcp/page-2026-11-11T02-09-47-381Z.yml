                      - paragraph [ref=f8e2207]: Die T-Shirts sind gut geschnitten, es sind keine störenden "Labels" dran, und der Stoff fühlt sich (für ein reines Baumwollprodukt) sehr glatt an, was wahrscheinlich daran liegt, dass dafür gekämmte Baumwolle verwendet wird. Falls es eine "Einschränkung" gibt aus meiner Sicht, dann ist es die Tatsache, dass der Stoff relativ dünn ausfüllt. Das T-Shirt wirkt aber keinesfalls "schleissig", es sei nur angeführt für den Fall, dass jemand eher dickere Stoffqualität für seine T-Shirts bevorzugt — dann gibt es sicher passendere Produkte. Für mich ist das Produkt den Kaufpreis aber absolut wert, daher 5/5 Sternen von mir.
