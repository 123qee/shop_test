<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>速卖通表单自动填写确认单</title><style>
:root{--ink:#172033;--muted:#64748b;--line:#dbe3ef;--blue:#2563eb;--bg:#f4f7fb;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}main{max-width:1200px;margin:28px auto;padding:0 16px}.hero,.group{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:15px;box-shadow:0 3px 12px #1e293b08}h1{font-size:24px;margin:0 0 7px}h2{font-size:18px;margin:0 0 12px}.hint,.muted{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:8px;padding:9px 13px;background:var(--blue);color:white;font-weight:600;cursor:pointer}button.secondary{background:#e8eef8;color:#24324a}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{text-align:left;padding:9px 7px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}th{font-size:12px;color:var(--muted)}td.field{width:17%;font-weight:600}td.current{width:30%;color:#475569}td.action{width:19%}td.target{width:34%}select,input{width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:8px;background:white;color:var(--ink)}.small{font-size:12px;color:var(--muted);font-weight:400}.note{font-size:13px;background:#f8fafc;padding:10px;border-radius:8px;margin-top:12px}#status{color:#15803d;align-self:center}@media(max-width:760px){table,tbody,tr,td{display:block;width:100%}thead{display:none}tr{padding:9px 0;border-top:1px solid var(--line)}td{border:0;padding:4px 0}td:before{content:attr(data-label);display:block;font-size:11px;color:var(--muted)}}@media print{body{background:white}button{display:none}.hero,.group{box-shadow:none;break-inside:avoid}}
</style></head><body><main><section class="hero"><h1>速卖通表单自动填写确认单</h1><p class="hint">当前值来自你给的商品编辑页。请在“处理方式”里确认：沿用当前值、每次自动填、需要修改，或手动处理。目标值留空表示沿用当前值/暂不自动填。</p><div class="toolbar"><button onclick="setAll('auto')">全部设为自动填写</button><button class="secondary" onclick="setAll('keep')">全部沿用当前值</button><button class="secondary" onclick="setAll('manual')">全部设为手动</button><button class="secondary" onclick="download()">导出我的选择</button><span id="status"></span></div><div class="note">“自动填写”可以使用页面已有值或你写的目标值。像标题、SKU 价格库存、图文和资质等会随商品变化的项目，请写清楚数据来源或规则。这里只收集需求，不会修改 ERP 商品。</div></section><div id="forms"></div></main>
<script>
const groups=[
['店铺与商品基础',[['店铺名称','cn1078201182qoyae','固定使用此店铺'],['产品标题','2026 Summer Men\'s T Shirts Fashion T Shirt Graphic Basic Vintage Couple Short Sleeve T Shirt Breathable Hip-Hop Unisex Big Size Tees Men Clothing Casual 100% Cotton Y2k Tops Sports Tee（当前184/128，超长）','需要标题模板、改写规则或来源字段'],['产品分类','男装 > 上衣，T恤 > T恤','固定沿用/按商品选择'],['产品分组','未选择分组','分组名称或继续不选']]],
['产品属性',[['品牌','空','品牌值；如无品牌可填无品牌'],['产地（国家或地区）','中国大陆 (Mainland China)','固定值/按商品变化'],['中国省份','江西 (Jiangxi)','固定值/按商品变化'],['袖长','短款（4-16inch）','沿用或规则'],['风格','休闲 (Casual)','固定值/按商品变化'],['材质','COTTON','固定值/按商品变化'],['适用场景','Daily','固定值/按商品变化'],['适用季节','夏季 (summer)','固定值/按商品变化'],['编织工艺','针织 (Knit)','固定值/按商品变化'],['特殊功能','可拉伸、可持续、防皱','可多选值'],['高关注化学品','无','固定值'],['产品保养说明','机洗 (Machine Wash)','固定值/按商品变化'],['性别','男性 (Men)','固定值/按商品变化'],['上衣类型','T恤 (TEES)','固定值/按商品变化'],['产品类型','tops','固定值/按商品变化'],['领型','圆领 (O-Neck)','固定值/按商品变化'],['袖型','空','袖型值/按商品判断'],['图案类型','印花','固定值/按商品变化'],['是否带帽','无帽 (No)','固定值/按商品变化'],['面料类型','细平布 (Broadcloth)','固定值/按商品变化'],['闭合方式','未选择','固定值/按商品变化'],['来源地','空','值/是否需要填写'],['自定义属性','未添加','属性名和值']]],
['SKU / 价格与库存',[['尺寸','XXS、XS、S、M、L、XL、XXL、XXXL（8个尺码均已选）','确认这8个尺码是否作为常用模板'],['颜色','黑色（当前1色）','颜色选项和英文SKU颜色写法'],['零售价（CNY）','85（8个尺码相同）','固定值/定价公式/每款不同'],['货值（CNY）','100（8个尺码相同）','申报价值填写规则'],['库存','999（每个尺码）','固定库存/每款变化'],['是否原箱','是（每个尺码）','固定值'],['SKU重量（kg）','0.22（每个尺码）','固定值/每款变化'],['SKU尺寸（cm）','20 × 20 × 2（每个尺码）','固定值/每款变化'],['物流属性','普货','固定值/按商品判断'],['商品编码','12-[尺码]-black（例如12-XXS-black）','确认沿用自动生成或提供编码规则'],['EAN / GTIN / UPC','空','是否保持空/数据来源'],['仓库SKU','未配对','是否自动配对及规则'],['发货地','未选择（显示“请选择发货地”）','固定值/按店铺变化'],['批发价','未开启','是否开启；如开启请给规则']]],
['描述与包装物流',[['PC端描述','已有描述，页面显示1123字符','沿用模板/按商品生成/从来源复制'],['无线端描述','当前未显示内容','导入PC描述/单独模板'],['尺码表','旧版已选，模板字段空','固定尺码模板/继续旧版'],['包装后重量','0.22 kg','固定值/按商品变化'],['包装后尺寸','15 × 15 × 2 cm','固定值/按商品变化'],['运费模板','copy copy copy copy copy 人民币20.9预算模板','模板名称；页面要选已有模板'],['服务模板','Service Template for New Sellers','固定沿用/按店铺变化'],['库存扣减方式','下单减库存','固定沿用/按需修改'],['报价是否含关税','含关税报价（美国区域）','确认是否固定含关税；当前表单提示需同步美国区域定价'],['海关监管属性','已配置','填充规则/保留手动']]],
['图片、资质与其他',[['产品图片','已有8张；主图选中6张','沿用/是否需要自动排序或删选'],['营销图片','1:1白底图、3:4场景图均可引用产品图片','沿用/是否都引用'],['产品视频','未添加','保留手动/说明来源'],['欧盟资质','申请已开启；纺织品标签和REACH检测报告当前可引用产品图片','是否自动引用图片；资质文件来源'],['波兰纺织纤维成分','100% cotton','填写内容或保留手动'],['欧盟责任人','Jiang Weijia','固定关联对象/暂不关联'],['制造商','Lead shan county qixie century trading co., ltd.','固定关联对象/暂不关联'],['来源URL','已有速卖通商品链接','沿用采集来源/需修改'],['产品发布前检查','标题长度超出128字符','是否增加自动截断/标题重写']]]
];
const root=document.getElementById('forms');for(const [title,fields] of groups){const section=document.createElement('section');section.className='group';section.innerHTML=`<h2>${title}</h2><table><thead><tr><th>字段</th><th>页面当前值</th><th>处理方式</th><th>目标值 / 自动化规则（可选填）</th></tr></thead><tbody></tbody></table>`;const body=section.querySelector('tbody');for(const [name,current,hint] of fields){const tr=document.createElement('tr');tr.innerHTML=`<td class="field" data-label="字段">${name}</td><td class="current" data-label="当前值">${current}</td><td class="action" data-label="处理方式"><select data-field="${name}"><option value="auto">自动填写</option><option value="keep">沿用当前值</option><option value="change">需要修改</option><option value="manual">我手动填</option><option value="skip">不使用 / 留空</option></select></td><td class="target" data-label="目标值 / 规则"><input data-value="${name}" placeholder="${hint}"></td>`;body.appendChild(tr)}root.appendChild(section)}
function setAll(v){document.querySelectorAll('[data-field]').forEach(s=>s.value=v)}function download(){const data={};document.querySelectorAll('[data-field]').forEach(s=>{let n=s.dataset.field;data[n]={current:s.closest('tr').querySelector('.current').innerText,action:s.value,target:s.closest('tr').querySelector('[data-value]').value.trim()}});const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='速卖通自动填写确认.json';a.click();URL.revokeObjectURL(a.href);document.getElementById('status').textContent='已导出选择'}
</script></body></html>
