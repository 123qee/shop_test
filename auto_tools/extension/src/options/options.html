<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Joom 采集助手 · 设置</title>
    <style>
      body { max-width: 440px; margin: 40px auto; padding: 0 20px;
        font-family: -apple-system, system-ui, sans-serif; color: #222; }
      h1 { font-size: 18px; }
      label { display: block; font-size: 13px; margin: 18px 0 6px; font-weight: 600; }
      input { width: 100%; padding: 9px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
      button { margin-top: 18px; padding: 9px 18px; border: none; border-radius: 6px;
        background: #ff4747; color: #fff; font-weight: 600; cursor: pointer; }
      .saved { color: #16a34a; font-size: 13px; margin-left: 10px; }
      .hint { font-size: 12px; color: #888; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>Joom 采集助手 · 设置</h1>
    <label for="backendUrl">后端地址</label>
    <input id="backendUrl" type="text" placeholder="http://localhost:8787" />
    <p class="hint">本地后端服务的地址,采集的商品会发送到这里。默认 http://localhost:8787</p>
    <div>
      <button id="save">保存</button>
      <span id="saved" class="saved" style="display: none">已保存 ✓</span>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
